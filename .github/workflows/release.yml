name: Build and Release APK

# Tag vX.Y.Z (albo ręcznie z numerem wersji) buduje podpisany APK wspólnym workflow
# Sklepu rodzinnego (grekot/App_storage) i publikuje GitHub Release:
#   kalendarzyk-arm64-v8a.apk  - nazwa z "arm64-v8a", której szuka wbudowana aktualizacja (update_checker.dart)
#   app.json, icon.png         - dla Sklepu rodzinnego
# Podpis: własny klucz Kalendarzyka (sekrety RELEASE_*), ten sam co dotąd - aktualizacje w miejscu.
# versionCode: 2000 (split arm64) + numer przebiegu + 100 (> 2005 z ostatniego wydania 1.1.3).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja wydania, np. 1.2.0 (tag v1.2.0 zostanie utworzony)'
        required: true

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  android:
    needs: meta
    uses: grekot/App_storage/.github/workflows/flutter-android-release.yml@main
    with:
      asset_name: kalendarzyk-arm64-v8a
      version: ${{ needs.meta.outputs.version }}
      tag: v${{ needs.meta.outputs.version }}
      release_name: Kalendarzyk v${{ needs.meta.outputs.version }}
      target_abi: arm64
      version_code_offset: 100
    secrets:
      KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
